name: CI

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  run-tests:
    name: Test (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [stdlib, benchmarks, resources, test]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh || true

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup C3
        uses: jotrorox/setup-c3@v1
        with:
          version: latest

      - name: Checkout C3 Compiler
        uses: actions/checkout@v4
        with:
          repository: c3lang/c3c
          path: c3c

      - name: Run Tests
        id: tests
        continue-on-error: true
        run: ./scripts/run_tests.sh ${{ matrix.target }}

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ runner.os }}-${{ matrix.target }}
          path: results-*/test_results.txt
          retention-days: 1

  summary:
    name: Final Test Results
    needs: run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh || true

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: results

      - name: Generate Summary
        run: ./scripts/summary.sh

name: CI

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  run-tests:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-22.04,
            ubuntu-slim,
            macos-26,
            macos-latest,
            macos-14,
            windows-2025-vs2026,
            windows-latest,
            windows-2022,
          ]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install C3 Compiler
        uses: ManuLinares/setup-c3@v1
        with:
          version: nightly

      - name: Checkout C3 Compiler
        uses: actions/checkout@v6
        with:
          repository: c3lang/c3c
          path: c3c

      - name: Run Tests
        id: tests
        continue-on-error: true
        run: bash ./scripts/run_tests.sh

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ runner.os }}
          path: results-*/
          retention-days: 1

      - name: Upload logs
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ runner.os }}
          path: test_logs_*
          retention-days: 1

  summary:
    name: Final Test Results
    needs: run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all test results
        uses: actions/download-artifact@v8
        with:
          path: results

      - name: Generate Summary
        run: bash ./scripts/summary.sh

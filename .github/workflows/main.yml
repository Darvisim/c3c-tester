name: CI

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  run-tests:
    name: Test (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            arch: x64
      
          - platform: Linux
            os: ubuntu-24.04-arm
            arch: arm64
      
          - platform: macOS
            os: macos-26-intel
            arch: x64
      
          - platform: macOS
            os: macos-26
            arch: arm64
      
          - platform: Windows
            os: windows-2025
            arch: x64
      
          - platform: Windows
            os: windows-11-arm
            arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # - name: Install C3 Compiler
      #   uses: ManuLinares/setup-c3@v1
      #   with:
      #     version: nightly

      - name: Checkout C3 Compiler
        uses: actions/checkout@v6
        with:
          repository: c3lang/c3c
          path: c3c

      - name: Build C3 Compiler
        run: |
          cmake -S c3c -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DC3_FETCH_LLVM=ON
          cmake --build build -j

      - name: Run Tests
        id: tests
        continue-on-error: true
        run: bash ./scripts/run_tests.sh

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ runner.os }}-${{ matrix.arch }}
          path: results-*/
          retention-days: 1

  summary:
    name: Final Test Results
    needs: run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all test results
        uses: actions/download-artifact@v8
        with:
          path: results

      - name: Generate Summary
        run: bash ./scripts/summary.sh

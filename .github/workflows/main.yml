name: CI

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-compiler:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - &chmod
        name: Make scripts executable
        run: chmod +x scripts/*.sh || true

      - &setup
        name: Setup Dependencies
        run: ./scripts/setup.sh

      - &msvc
        name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Cache C3 Compiler Repo
        uses: &cache actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: c3c
          key: ${{ runner.os }}-c3c-repo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-

      - &sync
        name: Sync C3 Compiler
        run: ./scripts/sync.sh https://github.com/c3lang/c3c.git c3c

      - name: Cache LLVM
        uses: *cache
        with:
          path: c3c/build/_deps
          key: ${{ runner.os }}-llvm-${{ hashFiles('c3c/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-

      - name: Build Compiler
        run: ./scripts/compiler.sh

      - name: Upload Compiler
        uses: &upload actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c3c-${{ runner.os }}
          path: c3c/build
          retention-days: 1


  run-tests:
    name: Test (${{ matrix.os }}, ${{ matrix.target }})
    needs: build-compiler
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [stdlib, benchmarks, resources, test]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    defaults:
      run:
        shell: bash

    steps:
      - *checkout
      - *chmod
      - *setup
      - *msvc

      - name: Restore Cached C3 Compiler Repo
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: c3c
          key: ${{ runner.os }}-c3c-repo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-

      - *sync

      - name: Download Compiler
        uses: &download actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: c3c-${{ runner.os }}
          path: c3c/build

      - name: Run Tests
        id: tests
        continue-on-error: true
        run: ./scripts/run_tests.sh ${{ matrix.target }}

      - name: Upload Test Results
        uses: *upload
        with:
          name: results-${{ runner.os }}-${{ matrix.target }}
          path: results-*/test_results.txt
          retention-days: 1

  summary:
    name: Final Test Results
    needs: run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        shell: bash

    steps:
      - *checkout
      - *chmod

      - name: Download all test results
        uses: *download
        with:
          path: results

      - name: Generate Summary
        run: ./scripts/summary.sh

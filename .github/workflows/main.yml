name: CI

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install C3 Compiler
        uses: ManuLinares/setup-c3@v1
        with:
          version: nightly

      - name: Checkout C3
        uses: actions/checkout@v7
        with:
          repository: c3lang/c3c
          path: c3c

      - name: Allocate Extra Memory
        shell: bash
        run: |
          echo "==> Allocating memory for ${{ runner.os }}..."
          case "${{ matrix.os }}" in
            ubuntu-latest)
              sudo swapoff -a
              sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              free -h
              ;;
              
            windows-latest)
              powershell -Command "
                \$ComputerSystem = Get-CimInstance Win32_ComputerSystem
                \$ComputerSystem.AutomaticManagedPagefile = \$False
                \$ComputerSystem | Set-CimInstance
                \$PageSetting = Get-CimInstance Win32_PageFileSetting | Where-Object {\$_.Name -like 'C:*'}
                if (\$PageSetting) {
                    \$PageSetting.InitialSize = 8192
                    \$PageSetting.MaximumSize = 8192
                    \$PageSetting | Set-CimInstance
                } else {
                    New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name='C:\\pagefile.sys'; InitialSize=8192; MaximumSize=8192}
                }
              "
              ;;
              
            macos-latest)
              sudo hdiutil create -size 8g -type SPARSE -fs HFS+X -volname SwapSpace /tmp/swapspace.sparseimage
              sudo hdiutil attach -nobrowse /tmp/swapspace.sparseimage
              sysctl vm.swapusage
              ;;
          esac

      - name: Run Tests
        id: tests
        continue-on-error: true
        run: bash ./scripts/run_tests.sh

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}
          path: results/${{ runner.os }}/
          retention-days: 1

  summary:
    name: Final Test Results
    needs: run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Download all test results
        uses: actions/download-artifact@v8
        with:
          path: results
          merge-multiple: true

      - name: Generate Summary
        run: bash ./scripts/summary.sh

      - name: Upload Combined Results
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: results/
          retention-days: 1
